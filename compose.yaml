name: ${COMPOSE_PROJECT_NAME:-mednearby}

services:
  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "true"
      # Ignore any Windows DLL paths from .env inside the Linux container.
      # Django will discover the shared libraries installed by the image.
      GDAL_LIBRARY_PATH: ""
      GEOS_LIBRARY_PATH: ""
      GDAL_DATA: /usr/share/gdal
      PROJ_LIB: /usr/share/proj
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    expose:
      - "8000"
    volumes:
      # Keep the container workspace in sync with this project directory.
      # Files created in /app (for example via `manage.py startapp`) will
      # therefore be created on the host as well.
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media

    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  # worker:
  #   build:
  #     context: .
  #   restart: unless-stopped
  #   command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=5"]
  #   env_file:
  #     - .env
  #   environment:
  #     REDIS_URL: redis://redis:6379/0
  #     RUN_MIGRATIONS: "false"
  #     COLLECT_STATIC: "false"
  #     GDAL_LIBRARY_PATH: ""
  #     GEOS_LIBRARY_PATH: ""
  #     GDAL_DATA: /usr/share/gdal
  #     PROJ_LIB: /usr/share/proj
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   volumes:
  #     - .:/app
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   security_opt:
  #     - no-new-privileges:true

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8081}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  static_data:
  media_data:
  redis_data:
